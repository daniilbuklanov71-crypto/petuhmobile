<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetuhMobile</title>
<style>
:root{--r:#e11d2e;--r2:#a80018;--bg:#fff;--card:#fff3f4;--tx:#1b1b1b;--mu:#7a7a7a;--bd:#f5ccd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;padding:14px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:900;font-size:22px;color:var(--r);letter-spacing:-.5px}
.ava{overflow:hidden;padding:0;width:40px;height:40px;border-radius:50%;background:var(--r);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:0;font-size:17px}
h2{font-size:18px;margin:20px 0 10px}
.bank{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(225,29,46,.25)}
.bank small{opacity:.85}.bank .big{font-size:32px;font-weight:800;margin:4px 0 14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.card b{display:block}.mu{color:var(--mu);font-size:13px}
.btn{display:block;width:100%;background:var(--r);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;margin-top:10px}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0;border-radius:11px}
.btn.o{background:#fff;color:var(--r);border:2px solid var(--r)}
.chips{display:flex;gap:8px;margin:8px 0}
.chip{flex:1;text-align:center;padding:10px 0;border-radius:12px;border:2px solid var(--bd);background:#fff;font-weight:700;color:var(--tx)}
.chip.on{border-color:var(--r);background:var(--r);color:#fff}
input[type=range]{width:100%;accent-color:var(--r)}
.in{width:100%;border:2px solid var(--bd);border-radius:14px;padding:13px;font-size:16px;margin-bottom:10px;background:#fff;color:var(--tx);outline:0}
.in:focus{border-color:var(--r)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;font-weight:700;color:var(--mu)}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--r)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.hero{text-align:center;padding:30px 0 16px}.hero .e{font-size:64px}
.tag{display:inline-block;background:var(--r);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const LIM=50000;
let S=null,tab='credit',cr={a:5000,d:14};
try{S=JSON.parse(localStorage.getItem('pm')||'null')}catch(e){}
if(S){if(!S.cr)S.cr=[];if(!S.items)S.items=[];if(!S.used)S.used=[];if(!S.notes)S.notes=[];S.late=S.late||0;S.clean=S.clean||0;S.unread=S.unread||0;if(S.sim)S.sim.num=S.sim.num.replace(/^\+7 /,'+67 ')}
function save(){try{localStorage.setItem('pm',JSON.stringify(S))}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n);
const digits=n=>Array.from({length:n},()=>rnd(10)).join('');
const simOpts=[
 {n:'Стандартный',p:100,num:'+67 900 '+digits(3)+' '+digits(2)+' '+digits(2)},
 {n:'Петушиный',p:500,num:'+67 777 '+digits(3)+' '+digits(2)+' '+digits(2)},
 {n:'Блатной',p:1500,num:'+67 888 '+(digits(1)+'00')+' '+digits(2)+' '+digits(2)}
];
const tariffs=[
 {n:'PetuhStart',g:'5 ГБ',p:199},
 {n:'PetuhMed',g:'30 ГБ',p:499},
 {n:'PetuhGod',g:'∞ ГБ',p:999}
];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,6)}

function viewReg(){
 $('#app').innerHTML=`<div class="hero"><div class="e">🐓</div><div class="logo" style="font-size:30px">PetuhMobile</div><div class="mu" style="margin-top:6px">Кредитный банк и связь для своих</div></div>
 <h2>Регистрация</h2>
 <input class="in" id="f1" placeholder="ФИО" autocomplete="name">
 <input class="in" id="f2" placeholder="Возраст" type="number" inputmode="numeric">
 <input class="in" id="f3" placeholder="Адрес" autocomplete="street-address">
 <input class="in" id="f4" placeholder="Страна" autocomplete="country-name">
 <button class="btn" onclick="reg()">Создать профиль</button>`;
}
function reg(){
 const v=i=>document.getElementById('f'+i).value.trim();
 const age=parseInt(v(2),10);
 if(!v(1)||!v(3)||!v(4)||!(age>0&&age<121)){toast('Заполните все поля, возраст 1–120');return}
 S={u:{fio:v(1),age,addr:v(3),country:v(4),card:digits(4)},bal:5000,cr:[],items:[],used:[],notes:[],late:0,clean:0,unread:0,sim:null,tar:null,log:['🎁 Приветственный бонус 5 000 ₽']};
 save();render();
}
function $(s){return document.querySelector(s)}

function render(){
 if(!S){viewReg();return}
 const ini=esc(S.u.fio.charAt(0).toUpperCase());
 let body=tab==='credit'?viewCredit():viewServices();
 $('#app').innerHTML=`<div class="top"><div class="logo" onclick="tapLogo()">🐓 PetuhMobile</div><div style="display:flex;gap:10px;align-items:center"><button class="ava" style="background:#fff;color:var(--r);border:2px solid var(--r);font-size:18px;position:relative;overflow:visible" onclick="notes()">🔔${S.unread?'<span class="tag" style="position:absolute;top:-8px;right:-8px;padding:1px 6px">'+S.unread+'</span>':''}</button><button class="ava" onclick="profile()">${av()}</button></div></div>${body}
 <div class="nav"><button class="${tab==='credit'?'on':''}" onclick="go('credit')"><span>💳</span>Кредит</button><button class="${tab==='svc'?'on':''}" onclick="go('svc')"><span>📶</span>Услуги связи</button></div>`;
 if(tab==='credit')prev();
}
function go(t){tab=t;render();window.scrollTo(0,0)}

const RATE=0.015,DAYS=3,PIN='6767';
const cc=c=>{let h=0;for(const ch of c+'|petuh')h=(h*31+ch.charCodeAt(0))>>>0;return String(h%900000+100000)};
const owe=c=>{const o=Date.now()-c.till;return c.back*(o>0?1.3+0.1*Math.floor(o/864e5):1)};
const debt=()=>S.cr.filter(c=>!c.paid).reduce((s,c)=>s+owe(c),0);
function viewCredit(){
 const D=debt(),av=Math.max(0,LIM-D);
 const max=Math.max(500,Math.floor(av/500)*500);
 if(cr.a>max)cr.a=max;
 const open=S.cr.filter(c=>!c.paid);
 return `<div class="bank"><small>Карта PetuhMobile •••• ${S.u.card}</small><div class="big">${rub(S.bal)}</div><div class="row"><small>${esc(S.u.fio)}</small><small>Лимит ${rub(LIM)}</small></div><div class="row" style="margin-top:14px"><button class="btn sm" style="flex:1;background:#fff;color:var(--r)" onclick="sendMoney()">📤 Перевести</button><button class="btn sm" style="flex:1;background:#fff;color:var(--r)" onclick="getMoney()">📥 Получить</button></div></div>
 ${(()=>{const r=rating();return `<div class="card" style="margin-top:12px"><div class="row"><b>Кредитный рейтинг</b><span style="display:flex;align-items:center;gap:8px;font-weight:800"><i style="width:18px;height:18px;border-radius:50%;background:${r.c};border:2px solid ${r.b};display:inline-block"></i>${r.n}</span></div></div>`})()}
 <div class="card" style="margin-top:12px"><div class="row"><div><b>Долг банку</b><span class="mu">Доступно: ${rub(av)}</span></div><b style="color:var(--r);font-size:20px">${rub(D)}</b></div></div>
 ${open.map(c=>{const late=Date.now()>c.till;return `<div class="card" style="border-color:var(--r)"><div class="row"><div><b>${rub(owe(c))}${c.item?' · '+esc(c.item):''}</b><span class="mu">вернуть до ${new Date(c.till).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div>${late?'<span class="tag">Просрочен!</span>':'<span class="tag" style="background:#555">3 дня</span>'}</div>
 ${late?'<div style="color:var(--r);font-weight:700;margin-top:8px">🚨 Штраф: +'+rub(owe(c)-c.back)+' (+30% и ещё +10% за каждый день)</div>':''}<div class="mu" style="margin-top:8px">Код кредита: <b style="display:inline;color:var(--tx);font-size:16px">${c.code}</b><br>Назовите код владельцу. Он даст код подтверждения, и сумма спишется с карты.</div>
 <input class="in" id="k${c.code}" placeholder="Код подтверждения" inputmode="numeric" style="margin:8px 0 0">
 <button class="btn sm" style="margin-top:8px;width:100%" onclick="repay('${c.code}')">Погасить</button></div>`}).join('')}
 <h2>Взять кредит</h2>
 <div class="card"><div class="row"><span class="mu">Сумма</span><b id="am" style="color:var(--r);font-size:22px">${rub(cr.a)}</b></div>
 <input type="range" id="rg" min="500" max="${max}" step="500" value="${cr.a}" oninput="cr.a=+this.value;prev()" ${av<500?'disabled':''}>
 <div class="mu" style="margin-top:6px">Срок: ровно ${DAYS} дня. Ставка 1,5% за весь срок. Петух не обманет 🐓</div><div class="row" style="margin-top:6px"><span>К возврату</span><b id="ret"></b></div>
 <button class="btn" onclick="take()">Получить кредит</button></div>
 <h2>Кредит на вещи</h2><div class="mu" style="margin:-4px 0 8px">Маркетплейс PetuhMarket 🛒</div>
 ${ITEMS.map((it,i)=>`<div class="card"><div class="row"><div style="font-size:34px">${it.e}</div><div style="flex:1;padding-left:6px"><b>${esc(it.n)}</b><span class="mu">PetuhMarket · ${esc(it.s)}</span></div><div style="text-align:right"><b style="color:var(--r)">${rub(it.p)}</b>${S.items.includes(it.n)?'<span class="tag">Куплено</span>':'<button class="btn sm" style="margin-top:6px" onclick="buyItem('+i+')">В кредит</button>'}</div></div></div>`).join('')}
 <h2>История</h2>${S.log.map(l=>`<div class="card mu" style="color:var(--tx)">${esc(l)}</div>`).join('')}
 <div class="card" style="text-align:center;margin-top:16px;border-color:var(--r)"><span class="mu">⚠️ Сотрудники PetuhMobile могут выбивать кредит любым способом.</span></div>`;
}
const RAT={w:{n:'Белый',c:'#ffffff',b:'#b5b5b5'},g:{n:'Зелёный',c:'#1fa84f',b:'#1fa84f'},y:{n:'Жёлтый',c:'#f5b800',b:'#f5b800'},r:{n:'Красный',c:'#d40000',b:'#d40000'}};
function rating(){
 if(!S.cr.length)return RAT.w;
 const now=Date.now(),open=S.cr.filter(c=>!c.paid);
 if(open.some(c=>now>c.till)||(S.late>0&&S.clean<2))return RAT.r;
 if(open.some(c=>c.till-now<864e5)||debt()>=LIM*0.7)return RAT.y;
 return RAT.g;
}
const av=()=>S.u.photo?'<img src="'+esc(S.u.photo)+'" style="width:100%;height:100%;object-fit:cover" alt="">':esc(S.u.fio.charAt(0).toUpperCase());
function note(x){S.notes.unshift({t:Date.now(),x});S.notes=S.notes.slice(0,15);S.unread=(S.unread||0)+1;toast(x)}
function check(){
 if(!S)return false;
 let ch=false;const now=Date.now();
 S.cr.forEach(c=>{
  if(c.paid)return;
  const left=c.till-now,nm=c.item||rub(c.back);
  if(left<=0){
   if(!c.late){c.late=true;S.late=(S.late||0)+1;S.clean=0;ch=true;note('🚨 Просрочка! Кредит '+nm+'. Штраф +30%, рейтинг: Красный')}
   const d=Math.floor(-left/864e5);
   if(d>(c.nd||0)){c.nd=d;ch=true;note('🚨 Просрочка '+d+' дн.: долг вырос до '+rub(owe(c))+'. Коллекторы уже выехали')}
  }else if(left<864e5&&!c.n24){c.n24=true;ch=true;note('⏰ Кредит '+nm+': меньше 24 часов до срока!')}
 });
 return ch;
}
function notes(){
 S.unread=0;save();
 const d=sheet('<div class="row"><b style="font-size:20px">Уведомления</b><button class="btn sm o" id="cl">Закрыть</button></div><div style="margin-top:12px;max-height:55vh;overflow:auto">'+(S.notes.length?S.notes.map(n=>'<div class="card"><div>'+esc(n.x)+'</div><span class="mu">'+new Date(n.t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>').join(''):'<div class="mu">Пока пусто</div>')+'</div>');
 d.querySelector('#cl').onclick=()=>d.remove();
 render();
}
function pickPhoto(inp,d){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=160;
   c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);
   S.u.photo=c.toDataURL('image/jpeg',.8);save();d.remove();render();profile();toast('Фото обновлено')};
  im.onerror=()=>toast('Не удалось открыть фото');
  im.src=r.result};
 r.readAsDataURL(f);
}
const ITEMS=[{n:'El patron',p:50000,s:'Редкий лот',e:'🕶️'}];
function buyItem(i){
 const it=ITEMS[i];
 if(S.items.includes(it.n))return;
 if(debt()+it.p>LIM){toast('Не хватает кредитного лимита');return}
 S.cr.push({code:digits(5),back:it.p*(1+RATE),till:Date.now()+DAYS*864e5,paid:false,item:it.n});
 S.items.push(it.n);log('🛒 PetuhMarket: «'+it.n+'» в кредит');
 save();render();toast('Заказ оформлен на PetuhMarket');
}
function prev(){const a=$('#am'),r=$('#ret');if(a)a.textContent=rub(cr.a);if(r)r.textContent=rub(cr.a*(1+RATE))}
function take(){
 if(LIM-debt()<cr.a){toast('Превышен лимит кредита');return}
 S.cr.push({code:digits(5),back:cr.a*(1+RATE),till:Date.now()+DAYS*864e5,paid:false});
 S.bal+=cr.a;log('💸 Кредит '+rub(cr.a)+' на '+DAYS+' дня');
 save();render();toast('Кредит одобрен! Кукареку 🐓');
}
function repay(code){
 const c=S.cr.find(x=>x.code===code&&!x.paid),v=document.getElementById('k'+code).value.trim();
 if(!c)return;
 if(v!==cc(code)){toast('Неверный код подтверждения');return}
 const o=owe(c);if(S.bal<o){toast('Не хватает денег на карте: нужно '+rub(o));return}
 S.bal-=o;c.paid=true;if(!c.late)S.clean=(S.clean||0)+1;log('✅ Кредит '+rub(o)+' погашен, списано с карты');
 save();render();toast('Кредит закрыт');
}
function sheet(h){const d=document.createElement('div');d.className='sheet';d.onclick=e=>{if(e.target===d)d.remove()};d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d);return d}
const tc=s=>{let h=0;for(const ch of s+'|tr')h=(h*37+ch.charCodeAt(0))>>>0;return String(h%9000+1000)};
function sendMoney(){
 const d=sheet('<b style="font-size:20px">Перевод другу</b><div class="mu" style="margin:8px 0">Деньги спишутся с карты, вы получите код. Отправьте код другу в мессенджере.</div><input class="in" id="ta" placeholder="Сумма, ₽" type="number" inputmode="numeric"><button class="btn" id="go">Перевести</button><div id="res" style="text-align:center;margin-top:14px"></div><button class="btn o" id="cl">Закрыть</button>');
 d.querySelector('#cl').onclick=()=>{d.remove();render()};
 d.querySelector('#go').onclick=()=>{
  const a=Math.floor(+d.querySelector('#ta').value);
  if(!(a>0&&a<=1e7)){toast('Введите сумму');return}
  if(a>S.bal){toast('Не хватает денег на карте');return}
  const id=digits(5),code=a+'-'+id+'-'+tc(a+'-'+id);
  S.bal-=a;S.used.push(id);log('📤 Перевод '+rub(a)+', код: '+code);save();
  d.querySelector('#res').innerHTML='Код перевода, отправьте его другу:<div style="font-size:26px;font-weight:900;color:var(--r);word-break:break-all">'+code+'</div><div class="mu">Код сохранён в истории</div>';
  d.querySelector('#go').remove();d.querySelector('#ta').remove();
 };
}
function getMoney(){
 const d=sheet('<b style="font-size:20px">Получить перевод</b><input class="in" id="tcode" placeholder="Код перевода" style="margin-top:12px"><button class="btn" id="go">Получить</button><button class="btn o" id="cl">Закрыть</button>');
 d.querySelector('#cl').onclick=()=>d.remove();
 d.querySelector('#go').onclick=()=>{
  const m=/^(\d+)-(\d{5})-(\d{4})$/.exec(d.querySelector('#tcode').value.trim());
  if(!m||tc(m[1]+'-'+m[2])!==m[3]){toast('Неверный код');return}
  if(S.used.includes(m[2])){toast('Этот код уже использован');return}
  const a=+m[1];S.used.push(m[2]);S.bal+=a;log('📥 Получен перевод '+rub(a));
  save();d.remove();render();toast('Получено '+rub(a));
 };
}
let tp=0,tt;
function tapLogo(){tp++;clearTimeout(tt);tt=setTimeout(()=>tp=0,1500);if(tp>=5){tp=0;ownerLogin()}}
function ownerLogin(){
 const d=sheet('<b style="font-size:20px">Режим владельца</b><input class="in" id="pin" type="password" inputmode="numeric" placeholder="PIN" style="margin-top:12px"><button class="btn" id="ok">Войти</button>');
 d.querySelector('#ok').onclick=()=>{if(d.querySelector('#pin').value!==PIN){toast('Неверный PIN');return}d.remove();ownerPanel()};
}
function ownerPanel(){
 const d=sheet('<b style="font-size:20px">Панель владельца</b><div class="mu" style="margin:8px 0">Введите код кредита, который назвал друг после оплаты</div><input class="in" id="oc" placeholder="Код кредита (5 цифр)" inputmode="numeric"><button class="btn" id="go">Подтвердить оплату</button><div id="res" style="text-align:center;margin-top:14px"></div><button class="btn o" id="cl">Закрыть</button>');
 d.querySelector('#cl').onclick=()=>d.remove();
 d.querySelector('#go').onclick=()=>{const v=d.querySelector('#oc').value.trim();if(!/^\d{5}$/.test(v)){toast('Код — 5 цифр');return}d.querySelector('#res').innerHTML='Код подтверждения для друга:<div style="font-size:38px;font-weight:900;color:var(--r)">'+cc(v)+'</div>'};
}

function viewServices(){
 let sim=S.sim?`<div class="card"><div class="row"><div><b style="font-size:18px">${esc(S.sim.num)}</b><span class="mu">SIM «${esc(S.sim.n)}»</span></div><span class="tag">Активна</span></div></div>`
 :simOpts.map((o,i)=>`<div class="card"><div class="row"><div><b>${o.n}</b><span class="mu">${o.num}</span></div><button class="btn sm" onclick="buySim(${i})">${rub(o.p)}/мес</button></div></div>`).join('');
 let cur=S.tar?`<div class="card" style="border-color:var(--r)"><div class="row"><div><b>Подключено: ${esc(S.tar.n)}</b><span class="mu">${esc(S.tar.g)} · до ${new Date(S.tar.till).toLocaleDateString('ru-RU')}</span></div><span class="tag">Интернет</span></div></div>`:'';
 return `<div class="card"><div class="row"><span class="mu">Баланс карты</span><b style="color:var(--r)">${rub(S.bal)}</b></div></div>
 <h2>Моя SIM-карта</h2>${sim}
 <h2>Тарифы интернета</h2>${cur}
 ${tariffs.map((t,i)=>`<div class="card"><div class="row"><div><b>${t.n}</b><span class="mu">${t.g} в месяц</span></div><button class="btn sm" onclick="buyTar(${i})">${rub(t.p)}/мес</button></div></div>`).join('')}`;
}
function buySim(i){
 const o=simOpts[i];
 if(S.bal<o.p){toast('Не хватает денег — возьмите кредит');return}
 S.bal-=o.p;S.sim={n:o.n,num:o.num};log('📱 SIM '+o.num);
 save();render();toast('SIM-карта выдана!');
}
function buyTar(i){
 const t=tariffs[i];
 if(!S.sim){toast('Сначала получите SIM-карту');return}
 if(S.bal<t.p){toast('Не хватает денег — возьмите кредит');return}
 S.bal-=t.p;S.tar={n:t.n,g:t.g,till:Date.now()+30*864e5};log('📶 Тариф «'+t.n+'»');
 save();render();toast('Тариф подключён!');
}

function profile(){
 const u=S.u,d=document.createElement('div');d.className='sheet';
 d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div><div class="row"><b style="font-size:20px">Профиль</b><button class="btn sm o" id="cl">Закрыть</button></div>
 <div style="text-align:center;margin-top:12px"><div class="ava" style="width:96px;height:96px;margin:0 auto;font-size:40px">${av()}</div><label class="btn sm o" style="display:inline-block;margin-top:10px">📷 Сменить фото<input type="file" accept="image/*" id="ph" hidden></label></div><div class="card" style="margin-top:12px"><b>${esc(u.fio)}</b><span class="mu">Возраст: ${esc(u.age)}</span><span class="mu">Адрес: ${esc(u.addr)}</span><span class="mu">Страна: ${esc(u.country)}</span><span class="mu">Карта •••• ${esc(u.card)}</span></div>
 <button class="btn o" id="lo">Удалить профиль</button></div>`;
 document.body.appendChild(d);
 d.querySelector('#cl').onclick=()=>d.remove();
 d.querySelector('#ph').onchange=function(){pickPhoto(this,d)};
 let sure=false;const lo=d.querySelector('#lo');lo.onclick=()=>{if(!sure){sure=true;lo.textContent='Нажмите ещё раз — удалить навсегда';lo.style.background='var(--r)';lo.style.color='#fff';return}S=null;try{localStorage.removeItem('pm')}catch(e){}tab='credit';d.remove();render()};
}
if(check())save();
render();
setInterval(()=>{if(check()){save();render()}},30000);
</script>
