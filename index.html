<meta charset="utf-8">

:root{--r:#e11d2e;--r2:#a80018;--bg:#fff;--card:#fff3f4;--tx:#1b1b1b;--mu:#7a7a7a;--bd:#f5ccd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;padding:14px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:900;font-size:22px;color:var(--r);letter-spacing:-.5px}
.ava{overflow:hidden;padding:0;width:40px;height:40px;border-radius:50%;background:var(--r);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:0;font-size:17px}
h2{font-size:18px;margin:20px 0 10px}
.bank{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(225,29,46,.25)}
.bank small{opacity:.85}.bank .big{font-size:32px;font-weight:800;margin:4px 0 14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.card b{display:block}.mu{color:var(--mu);font-size:13px}
.btn{display:block;width:100%;background:var(--r);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;margin-top:10px}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0;border-radius:11px}
.btn.o{background:#fff;color:var(--r);border:2px solid var(--r)}
.chips{display:flex;gap:8px;margin:8px 0}
.chip{flex:1;text-align:center;padding:10px 0;border-radius:12px;border:2px solid var(--bd);background:#fff;font-weight:700;color:var(--tx)}
.chip.on{border-color:var(--r);background:var(--r);color:#fff}
input[type=range]{width:100%;accent-color:var(--r)}
.in{width:100%;border:2px solid var(--bd);border-radius:14px;padding:13px;font-size:16px;margin-bottom:10px;background:#fff;color:var(--tx);outline:0}
.in:focus{border-color:var(--r)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;font-weight:700;color:var(--mu)}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--r)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end}
.sheet>div{max-height:92vh;overflow:auto;background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.hero{text-align:center;padding:30px 0 16px}.hero .e{font-size:64px}
.tag{display:inline-block;background:var(--r);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
</style>
</head>

 <button class="btn" onclick="reg()">Создать профиль</button>`;
}
function reg(){
 const v=i=>document.getElementById('f'+i).value.trim();
 const age=parseInt(v(2),10);
 if(v(1).length<2){toast('ФИО: минимум 2 символа');return}
 if(v(5)&&!/^\+?[0-9 ()-]{5,20}$/.test(v(5))){toast('Телефон: только цифры, + ( ) и дефис');return}
 if(!v(1)||!v(3)||!v(4)||!(age>0&&age<121)){toast('Заполните все поля, возраст 1–120');return}
 S={u:{fio:v(1),age,addr:v(3),country:v(4),phone:v(5),card:digits(4)},bal:5000,cr:[],items:[],used:[],notes:[],late:0,clean:0,unread:0,sim:null,tar:null,log:['🎁 Приветственный бонус 5 000 ₽']};

 if(!S){okReg()?viewReg():viewGate();return}

 let body=tab==='credit'?viewCredit():tab==='job'?viewWork():viewServices();
 $('#app').innerHTML=`<div class="top"><div class="logo" onclick="tapLogo()">🐓 PetuhMobile</div><div style="display:flex;gap:10px;align-items:center"><button class="ava" style="background:#fff;color:var(--r);border:2px solid var(--r);font-size:18px;position:relative;overflow:visible" onclick="notes()">🔔${S.unread?'<span class="tag" style="position:absolute;top:-8px;right:-8px;padding:1px 6px">'+S.unread+'</span>':''}</button><button class="ava" onclick="profile()">${av()}</button></div></div>${body}
 <div class="nav"><button class="${tab==='credit'?'on':''}" onclick="go('credit')"><span>💳</span>Кредит</button><button class="${tab==='svc'?'on':''}" onclick="go('svc')"><span>📶</span>Услуги связи</button><button class="${tab==='job'?'on':''}" onclick="go('job')"><span>💰</span>Заработок</button></div>`;
 if(tab==='credit'){prev();pmTopLoad(false);if(mk==='auction')pmAucLoad(false)}else if(tab==='job'&&sub==='exchange')pmExLoad(false);
}

const RATE=0.015,DAYS=3,PIN='6767';
const cc=c=>{let h=0;for(const ch of c+'|petuh')h=(h*31+ch.charCodeAt(0))>>>0;return String(h%900000+100000)};
const owe=c=>{const o=Date.now()-c.till;return Math.max(0,c.back*(o>0?1.3+0.1*Math.floor(o/864e5):1)-(c.coll||0))};
const debt=()=>S.cr.filter(c=>!c.paid).reduce((s,c)=>s+owe(c),0);
function viewCredit(){
 const D=debt(),av=Math.max(0,LIM-D);
 const max=Math.max(500,Math.floor(av/500)*500);
 if(cr.a>max)cr.a=max;
 const open=S.cr.filter(c=>!c.paid);
 return `<div class="bank"><small>Карта PetuhMobile •••• ${S.u.card}</small><div class="big">${rub(S.bal)}</div><div class="row"><small>${esc(S.u.fio)}</small><small>Лимит ${rub(LIM)}</small></div><div class="row" style="margin-top:14px"><button class="btn sm" style="flex:1;background:#fff;color:var(--r)" onclick="sendMoney()">📤 Перевести</button><button class="btn sm" style="flex:1;background:#fff;color:var(--r)" onclick="getMoney()">🪪 Мой номер</button></div></div>
 ${bonusCard()}
 ${(()=>{const r=rating();return `<div class="card" style="margin-top:12px"><div class="row"><b>Кредитный рейтинг</b><span style="display:flex;align-items:center;gap:8px;font-weight:800"><i style="width:18px;height:18px;border-radius:50%;background:${r.c};border:2px solid ${r.b};display:inline-block"></i>${r.n}</span></div></div>`})()}
 <div class="card" style="margin-top:12px"><div class="row"><div><b>Долг банку</b><span class="mu">Доступно: ${rub(av)}</span></div><b style="color:var(--r);font-size:20px">${rub(D)}</b></div></div>
 ${open.map(c=>{const late=Date.now()>c.till;return `<div class="card" style="border-color:var(--r)"><div class="row"><div><b>${rub(owe(c))}${c.item?' · '+esc(c.item):''}</b><span class="mu">вернуть до ${new Date(c.till).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div>${late?'<span class="tag">Просрочен!</span>':'<span class="tag lt" data-t="'+c.till+'" style="background:#555">'+fmtLeft(c.till-Date.now())+'</span>'}</div>
 ${late?'<div style="color:var(--r);font-weight:700;margin-top:8px">🚨 Штраф: +'+rub(owe(c)+(c.coll||0)-c.back)+' (+30% и ещё +10% за каждый день)</div>':''}<div class="mu" style="margin-top:8px">Код кредита: <b style="display:inline;color:var(--tx);font-size:16px">${c.code}</b><br>Назовите код владельцу. Он даст код подтверждения, и сумма спишется с карты.</div>
 <input class="in" id="k${c.code}" placeholder="Код подтверждения" inputmode="numeric" style="margin:8px 0 0">
 <button class="btn sm" style="margin-top:8px;width:100%" onclick="repay('${c.code}')">Погасить</button>${late||(c.ext||0)>=2?'':'<button class="btn sm o" style="margin-top:8px;width:100%" onclick="extend(\''+c.code+'\')">Продлить на 1 день · комиссия '+rub(c.back*0.1)+'</button>'}</div>`}).join('')}
 <h2>Взять кредит</h2>
 <div class="card"><div class="row"><span class="mu">Сумма</span><b id="am" style="color:var(--r);font-size:22px">${rub(cr.a)}</b></div>
 <input type="range" id="rg" min="500" max="${max}" step="500" value="${cr.a}" oninput="cr.a=+this.value;prev()" ${av<500?'disabled':''}>
 <div class="mu" style="margin-top:6px">Срок: ровно ${DAYS} дня. Ставка 1,5% за весь срок. Петух не обманет 🐓</div><div class="row" style="margin-top:6px"><span>К возврату</span><b id="ret"></b></div>
 <button class="btn" onclick="take()">Получить кредит</button></div>
 <h2>Маркет и аукцион</h2><div class="chips"><button class="chip ${mk==='market'?'on':''}" onclick="setMk('market')">🛒 Маркет</button><button class="chip ${mk==='auction'?'on':''}" onclick="setMk('auction')">🔨 Аукцион</button></div>
 ${mk==='market'?marketHtml():'<div id="pmauc">'+aucHtml()+'</div>'}
 <div id="pmtop">${topHtml()}</div>
 <h2>История</h2>${S.log.map(l=>`<div class="card mu" style="color:var(--tx)">${esc(l)}</div>`).join('')}
 <div class="card" style="text-align:center;margin-top:16px;border-color:var(--r)"><span class="mu">⚠️ Сотрудники PetuhMobile могут выбивать кредит любым способом.</span></div><button class="btn o" onclick="collectorLogin()">🔎 Режим коллектора</button>`;
}
const RAT={w:{n:'Белый',c:'#ffffff',b:'#b5b5b5'},g:{n:'Зелёный',c:'#1fa84f',b:'#1fa84f'},y:{n:'Жёлтый',c:'#f5b800',b:'#f5b800'},r:{n:'Красный',c:'#d40000',b:'#d40000'}};
function rating(){
 if(!S.cr.length)return RAT.w;
 const now=Date.now(),open=S.cr.filter(c=>!c.paid);
 if(open.some(c=>now>c.till)||(S.late>0&&S.clean<2))return RAT.r;
 if(open.some(c=>c.till-now<864e5)||debt()>=LIM*0.7)return RAT.y;
 return RAT.g;
}
const av=()=>S.u.photo?'<img src="'+esc(S.u.photo)+'" style="width:100%;height:100%;object-fit:cover" alt="">':esc(S.u.fio.charAt(0).toUpperCase());
function note(x,sender='',time=Date.now()){
 S.notes.unshift({t:time,x,sender});S.notes=S.notes.slice(0,30);S.unread=(S.unread||0)+1;toast(sender?sender+': '+x:x)
}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const atLocal=(d,h,m)=>{const x=new Date(d);x.setHours(h,m,0,0);return x.getTime()};
function msgPlan(key){
 S.msgPlan=S.msgPlan||{};
 if(S.msgPlan[key])return S.msgPlan[key];
 const base=new Date(key+'T12:00:00');
 const pick=()=>Math.floor(Math.random()*1440);
 const nightA=Math.floor(Math.random()*421),nightB=Math.floor(Math.random()*421);
 S.msgPlan[key]={
  daily:[{id:key+'-bal',t:atLocal(base,0,0)+pick()*60000,x:'Ваш баланс выглядит подозрительно. Мы наблюдаем.'},{id:key+'-loan',t:atLocal(base,0,0)+pick()*60000,x:'Здравствуйте возьмите в долг пожал'}],
  night:[{id:key+'-night1',t:atLocal(base,23,0)+nightA*60000,x:'Не прячьтесь. Мы просто хотим поговорить'},{id:key+'-night2',t:atLocal(base,23,0)+nightB*60000,x:'Мы ближе чем ты думаешь'}]
 };
 if(S.msgPlan[key].night[0].t===S.msgPlan[key].night[1].t)S.msgPlan[key].night[1].t+=60000;
 return S.msgPlan[key];
}
function scheduledMessages(now){
 const today=dayKey(now),yesterday=dayKey(now-86400000);let changed=false;
 S.msgDone=S.msgDone||[];
 const events=[];
 const todayPlan=msgPlan(today);
 events.push(...todayPlan.daily,...todayPlan.night,{id:today+'-rafal',t:atLocal(new Date(today+'T12:00:00'),0,0),x:'меня найдут на дне озера',sender:'RAFAL BIRD'});
 events.push(...msgPlan(yesterday).night);
 events.sort((a,b)=>a.t-b.t);
 for(const e of events){
  if(now>=e.t&&!S.msgDone.includes(e.id)){
   note(e.x,e.sender||'',e.t);S.msgDone.push(e.id);changed=true;
  }
 }
 S.msgDone=S.msgDone.slice(-40);
 const keys=Object.keys(S.msgPlan||{});for(const k of keys)if(k!==today&&k!==yesterday)delete S.msgPlan[k];
 return changed;
}
function check(){
 if(!S)return false;
 let ch=false;const now=Date.now();
 S.cr.forEach(c=>{
  if(c.paid)return;
  const left=c.till-now,nm=c.item||rub(c.back);
  if(left<=0){
   if(!c.late){c.late=true;S.late=(S.late||0)+1;S.clean=0;ch=true;note('🚨 Просрочка! Кредит '+nm+'. Штраф +30%, рейтинг: Красный')}
   const d=Math.floor(-left/864e5);
   if(d>(c.nd||0)){c.nd=d;ch=true;note('🚨 Просрочка '+d+' дн.: долг вырос до '+rub(owe(c))+'. Коллекторы уже выехали')}
  }else if(left<864e5&&!c.n24){c.n24=true;ch=true;note('⏰ Кредит '+nm+': меньше 24 часов до срока!')}
 });
 {const TAXP=3*864e5,per=Math.floor(Date.now()/TAXP);
  if(S.taxP==null){S.taxP=per;ch=true}
  else if(per>S.taxP){let tot=0;for(let k=0;k<Math.min(3,per-S.taxP);k++){const t=Math.floor(S.bal*0.05);S.bal-=t;tot+=t}S.taxP=per;ch=true;log('🧾 Налоговая проверка: −'+rub(tot));note('🧾 Налоговая проверка: списано '+rub(tot)+' (5% от баланса)')}}
 if(S.job&&S.job.dl&&Date.now()>S.job.dl){note('❌ Срочный заказ отменён: вы не успели отдать');S.job=null;S.jcd=Date.now()+CDJOB*1000;ch=true}
 if(S.job&&!S.job.nd&&Date.now()>=S.job.end){S.job.nd=1;ch=true;note('🛵 Заказ «'+S.job.n+'» доставлен — заберите оплату')}
 if(S.sim&&bill('sim','SIM '+S.sim.num))ch=true;
 if(S.tar&&bill('tar','Тариф '+S.tar.n))ch=true;
 if(S.tar&&!S.tar.off&&S.tar.gb&&!S.tar.nz&&gbLeft(S.tar)<=0){S.tar.nz=1;ch=true;note('📵 Гигабайты закончились. Докупите +5 ГБ или дождитесь продления')}
 if(scheduledMessages(now))ch=true;
 return ch;
}
function bill(k,nm){
 const x=S[k];if(!x||x.off)return false;
 let ch=false;const now=Date.now();
 if(now>=x.till){
  if(x.auto){
   while(now>=x.till&&S.bal>=x.p){S.bal-=x.p;x.till+=MO;x.extra=0;x.nz=0;log('📅 Списано '+rub(x.p)+': '+nm);ch=true}
   if(now>=x.till){x.off=true;ch=true;note('⛔ '+nm+' отключён: не хватило денег на карте. Нужно '+rub(x.p))}
   else note('💳 Автосписание '+rub(x.p)+': '+nm);
  }else{x.off=true;ch=true;note('⛔ '+nm+' отключён: срок истёк')}
 }else if(x.till-now<864e5&&x.nt!==x.till){x.nt=x.till;ch=true;note(x.auto?'⏰ Через 24 часа спишется '+rub(x.p)+': '+nm:'⏰ Через 24 часа отключится: '+nm)}
 return ch;
}

const pmTO=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
const pmRpc=(n,a)=>pmTO(Promise.resolve(pmClient.rpc(n,a)),20000,'Supabase не отвечает. Проверьте интернет и попробуйте ещё раз');
let pmAuthP=null;
function pmEnsureAnonymousAuth(){
  if(pmAuthP)return pmAuthP;
  pmAuthP=pmTO((async()=>{
    if(!pmClient)throw new Error('Не удалось загрузить Supabase SDK');
    const {data:{session},error}=await pmClient.auth.getSession();
    if(error)throw error;
    if(!session){
      const r=await pmClient.auth.signInAnonymously();
      if(r.error)throw r.error;
    }
  })(),20000,'Не удалось войти в Supabase: нет ответа').finally(()=>{pmAuthP=null});
  return pmAuthP;
}
let pmVCN=null,pmVCNBusy=null,pmVCNErr='';
try{pmVCN=localStorage.getItem('pm_vcn')||null}catch(e){}
const pmExtract=d=>{if(d==null)return null;if(typeof d==='string'||typeof d==='number')return String(d);if(Array.isArray(d))return pmExtract(d[0]);return d.virtual_card_number?String(d.virtual_card_number):null};
const pmName=()=>{const n=String((S&&S.u&&S.u.fio)||'').trim();return n.length<2?(n+'..').slice(0,2):n};
function pmSyncProfile(){
  if(!S)return Promise.resolve(null);
  if(pmVCN)return Promise.resolve(pmVCN);
  if(pmVCNBusy)return pmVCNBusy;
  pmVCNBusy=(async()=>{
    try{
      await pmEnsureAnonymousAuth();
      const {data,error}=await pmRpc('pm_register_profile',{p_full_name:pmName()});
      if(error)throw error;
      const n=pmExtract(data);
      if(!n)throw new Error('Supabase не вернул номер карты');
      pmVCN=n;pmVCNErr='';
      try{localStorage.setItem('pm_vcn',n)}catch(e){}
      return n;
    }catch(e){
      pmVCNErr=(e&&e.message)||'Не удалось связаться с Supabase';
      throw e;
    }finally{pmVCNBusy=null}
  })();
  return pmVCNBusy;
}

  const d=sheet('<div class="row"><b style="font-size:20px">🔎 Коллектор</b><button class="btn sm o" id="pmcl">Закрыть</button></div><div class="mu" style="margin:8px 0 12px">Поиск только по виртуальному номеру PetuhMobile. Личные контакты и адреса не отображаются.</div><input class="in" id="pmcard" placeholder="Например, PM + виртуальный номер" autocapitalize="characters"><button class="btn" id="pmfind">Найти должника</button><button class="btn o" id="pmlist">📋 Список должников</button><div id="pmlistout" style="margin-top:10px"></div><input class="in" id="pman" maxlength="300" placeholder="Объявление всем игрокам" style="margin-top:14px"><button class="btn o" id="pmann">📢 Отправить объявление всем</button><div id="pmresult" style="margin-top:12px"></div><button class="btn o" id="pmexit">Завершить сеанс коллектора</button>');
  d.querySelector('#pmcl').onclick=()=>d.remove();
  d.querySelector('#pmann').onclick=async()=>{
    const b=d.querySelector('#pmann'),t=d.querySelector('#pman').value.trim();
    if(!t){toast('Введите текст объявления');return}
    b.disabled=true;b.textContent='Отправляем…';
    try{const r=await pmRpc('pm_collector_announce',{p_body:t});if(r.error)throw r.error;d.querySelector('#pman').value='';toast('Объявление отправлено всем')}catch(e){toast(e.message||'Не удалось отправить')}
    b.disabled=false;b.textContent='📢 Отправить объявление всем';
  };
  d.querySelector('#pmlist').onclick=async()=>{
    const lb=d.querySelector('#pmlist'),lo=d.querySelector('#pmlistout');
    lb.disabled=true;lb.textContent='Загружаем…';
    try{
      const r=await pmRpc('pm_collector_debtors');if(r.error)throw r.error;
      const L=r.data||[];
      lo.innerHTML=L.length?'<div class="mu" style="margin-bottom:6px">Нажмите на человека: можно списать деньги или отправить сообщение</div>'+L.map(x=>{
        const ms=new Date(x.next_due)-Date.now(),late=x.overdue||ms<=0,ab=Math.abs(ms),n=ab<864e5?Math.ceil(ab/36e5)+' ч':Math.ceil(ab/864e5)+' дн.';
        return '<div class="card" data-n="'+esc(x.virtual_card_number)+'" style="cursor:pointer'+(late?';border-color:var(--r)':'')+'"><div class="row"><div><b>'+esc(x.full_name)+'</b><span class="mu">'+esc(x.virtual_card_number)+' · кредитов: '+esc(x.loans)+'</span><span class="mu" style="'+(late?'color:var(--r);font-weight:700':'')+'">'+(late?'просрочен ':'осталось ')+n+'</span></div><b style="color:var(--r)">'+rub(x.total_debt)+'</b></div></div>';
      }).join(''):'<div class="mu">Открытых кредитов нет</div>';
      lo.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{d.querySelector('#pmcard').value=e.dataset.n;d.querySelector('#pmfind').click()});
    }catch(e){toast(e.message||'Не удалось загрузить список')}
    lb.disabled=false;lb.textContent='📋 Список должников';
  };
  d.querySelector('#pmexit').onclick=async()=>{
    try{await pmRpc('pm_collector_exit')}catch(e){}
    pmCollectorSession=false;d.remove();toast('Сеанс коллектора завершён');
  };
  d.querySelector('#pmfind').onclick=async()=>{
    const num=d.querySelector('#pmcard').value.trim().toUpperCase();
    const out=d.querySelector('#pmresult'),b=d.querySelector('#pmfind');
    if(!num){toast('Введите виртуальный номер');return}
    b.disabled=true;b.textContent='Поиск…';out.innerHTML='';
    try{
      const {data,error}=await pmRpc('pm_collector_lookup',{p_virtual_card_number:num});
      if(error)throw error;
      out.innerHTML=`<div class="card"><b>${esc(data.full_name)}</b><span class="mu">Виртуальный номер: ${esc(data.virtual_card_number)}</span><div class="row" style="margin-top:12px"><span>Общая задолженность</span><b style="color:var(--r)">${rub(Number(data.total_debt)||0)}</b></div><div class="row" style="margin-top:8px"><span>Активные кредиты</span><b>${Number(data.active_loans)||0}</b></div><div class="row" style="margin-top:8px"><span>Просроченные кредиты</span><b>${Number(data.overdue_loans)||0}</b></div><div style="margin-top:12px"><span class="tag">${esc(data.debt_status)}</span></div>${data.phone?'<div class="row" style="margin-top:12px"><b>📞 '+esc(data.phone)+'</b><a class="btn sm" href="tel:'+esc(String(data.phone).replace(/[^0-9+]/g,''))+'" style="text-decoration:none">Позвонить</a></div>':'<div class="mu" style="margin-top:12px">Телефон не указан</div>'}<div style="margin-top:14px"><input class="in" id="pmsa" type="number" inputmode="numeric" placeholder="Сумма, ₽"><button class="btn" id="pmsz">Списать указанную сумму</button><button class="btn o" id="pmall">Забрать всё, что есть на карте</button><input class="in" id="pmmsg" maxlength="200" placeholder="Сообщение должнику (до 200 символов)" style="margin-top:14px"><button class="btn o" id="pmsend">📩 Отправить сообщение</button><button class="btn o" id="pmjail">🔒 Посадить в тюрьму на 24 ч</button><button class="btn o" id="pmfree">🔓 Освободить из тюрьмы</button></div></div>`;
      const go=async(amt,btn,label)=>{
        btn.disabled=true;btn.textContent='Отправляем…';
        try{const r=await pmRpc('pm_collector_seize',{p_virtual_card_number:num,p_amount:amt});if(r.error)throw r.error;toast('Заявка отправлена. Деньги спишутся, когда должник откроет приложение')}catch(e){toast(e.message||'Не удалось списать')}
        btn.disabled=false;btn.textContent=label;
      };
      const b1=out.querySelector('#pmsz'),b2=out.querySelector('#pmall');
      b1.onclick=()=>{const a=Math.floor(+out.querySelector('#pmsa').value);if(!(a>0)){toast('Введите сумму');return}go(a,b1,'Списать указанную сумму')};
      b2.onclick=()=>go(10000000,b2,'Забрать всё, что есть на карте');
      const b3=out.querySelector('#pmsend');
      b3.onclick=async()=>{
        const t=out.querySelector('#pmmsg').value.trim();
        if(!t){toast('Введите сообщение');return}
        b3.disabled=true;b3.textContent='Отправляем…';
        try{const r=await pmRpc('pm_collector_message',{p_virtual_card_number:num,p_body:t});if(r.error)throw r.error;out.querySelector('#pmmsg').value='';toast('Сообщение отправлено')}catch(e){toast(e.message||'Не удалось отправить')}
        b3.disabled=false;b3.textContent='📩 Отправить сообщение';
      };
      const jgo=async(fn,args,msg,btn,label)=>{btn.disabled=true;btn.textContent='…';try{const r=await pmRpc(fn,args);if(r.error)throw r.error;toast(msg)}catch(e){toast(e.message||'Не удалось')}btn.disabled=false;btn.textContent=label};
      const bj=out.querySelector('#pmjail'),bf=out.querySelector('#pmfree');
      bj.onclick=()=>jgo('pm_collector_jail',{p_virtual_card_number:num,p_hours:24},'Посажен в тюрьму на 24 часа',bj,'🔒 Посадить в тюрьму на 24 ч');
      bf.onclick=()=>jgo('pm_collector_unjail',{p_virtual_card_number:num},'Освобождён',bf,'🔓 Освободить из тюрьмы');
    }catch(e){out.innerHTML=`<div class="card" style="color:var(--r)">${esc(e.message||'Не удалось выполнить поиск')}</div>`}
    b.disabled=false;b.textContent='Найти должника';
  };
}

const VER='34';
async function upd(){try{const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});const t=await r.text();const m=/const VER='(\d+)'/.exec(t);if(m&&m[1]!==VER&&location.search!=='?v='+m[1])location.replace(location.pathname+'?v='+m[1])}catch(e){}}
upd();document.addEventListener('visibilitychange',()=>{if(!document.hidden){upd();if(check()){save();render()}}});
mig();if(S){check();save()}
render();
if(S)pmSyncProfile().then(()=>{pmQueueLoans();pmSeizureSync();pmTransferSync();pmMsgSync();pmSimSync();pmPhoneSync();pmSaleSync();pmAnnSync();pmJailSync()}).catch(()=>{});
setInterval(()=>{if(check()){save();render()}else if(tab==='svc')render();pmQueueLoans();pmSeizureSync();pmTransferSync();pmMsgSync();pmSimSync();pmPhoneSync();pmSaleSync();pmAnnSync();pmJailSync();if(tab==='job'&&sub==='exchange')pmExLoad(true)},30000);
